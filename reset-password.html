<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fitin — Reset password</title>
<script>try{var m=localStorage.getItem('fitin-view-mode');if(m)document.documentElement.dataset.viewMode=m;}catch(e){}</script>
<link rel="stylesheet" href="_ds/nocturne-80ca4b25-89f2-4e0d-accf-6f8bf2e523f1/styles.css">
<link rel="stylesheet" href="assets/view-toggle.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
  body { margin: 0; }
  a { color: var(--color-accent); }
  a:hover { color: var(--color-accent-300); }

  .form-msg { font-size: 12px; margin: -4px 0 0; }
  .form-msg.is-error { color: #e5484d; }
  .form-msg.is-success { color: var(--color-accent); }
  .btn[disabled] { pointer-events: none; }

  #pw-requirements { font-size: 12px; color: var(--color-neutral-500); display: none; margin-top: -6px; }
  #pw-requirements ul { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
  #pw-requirements li { display: flex; align-items: center; gap: 6px; }
  #pw-requirements li i { color: var(--color-neutral-500); opacity: 0.5; }
  #pw-requirements li.is-met i { color: var(--color-accent); opacity: 1; }
  #pw-requirements .sub-rule { margin-left: 18px; }
</style>
</head>
<body style="background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);min-height:100vh">

  <header style="position:sticky;top:0;z-index:20;backdrop-filter:blur(12px);background:color-mix(in srgb, var(--color-bg) 88%, transparent);border-bottom:1px solid var(--color-divider)">
    <div style="max-width:1180px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px">
      <a href="Fitin%20Main.dc.html" style="display:flex;align-items:center;text-decoration:none">
        <img src="assets/logo.png" alt="Fitin Connection" style="height:36px;width:36px;border-radius:9px">
      </a>
      <div style="margin-left:auto">
        <div id="lang-toggle-mount"></div>
        <div id="view-toggle-mount"></div>
      </div>
    </div>
  </header>

  <main style="max-width:1180px;margin:0 auto;padding:56px 24px 80px;display:flex;justify-content:center">
    <div class="card elev-md" style="width:min(420px,100%);padding:28px;display:flex;flex-direction:column;gap:14px">

      <div style="text-align:center;margin-bottom:8px">
        <h1 style="font-size:24px;margin-bottom:6px" data-i18n-ko="새 비밀번호 설정">Set a new password</h1>
        <p id="intro-msg" style="font-size:13px;color:var(--color-neutral-500);margin:0" data-i18n-ko="계정의 새 비밀번호를 입력해주세요.">Choose a new password for your account.</p>
      </div>

      <form id="reset-form">
        <div class="field">
          <label for="new-password" data-i18n-ko="새 비밀번호">New password</label>
          <input class="input" type="password" id="new-password" placeholder="At least 10 characters" required>
        </div>
        <div id="pw-requirements">
          <p style="margin:0" data-i18n-ko="비밀번호는 다음을 포함해야 합니다:">Your password must contain:</p>
          <ul>
            <li data-rule="length"><i class="ph ph-check-circle"></i><span data-i18n-ko="10자 이상">At least 10 characters</span></li>
            <li><span data-i18n-ko="다음 중 3가지 이상:">At least 3 of the following:</span></li>
            <li class="sub-rule" data-rule="lower"><i class="ph ph-check-circle"></i><span data-i18n-ko="소문자 (a-z)">Lower case letters (a-z)</span></li>
            <li class="sub-rule" data-rule="upper"><i class="ph ph-check-circle"></i><span data-i18n-ko="대문자 (A-Z)">Upper case letters (A-Z)</span></li>
            <li class="sub-rule" data-rule="number"><i class="ph ph-check-circle"></i><span data-i18n-ko="숫자 (0-9)">Numbers (0-9)</span></li>
            <li class="sub-rule" data-rule="special"><i class="ph ph-check-circle"></i><span data-i18n-ko="특수문자 (예: !@#$%^&amp;*)">Special characters (e.g. !@#$%^&amp;*)</span></li>
          </ul>
        </div>
        <p id="reset-msg" class="form-msg" hidden style="margin-top:10px"></p>
        <button type="submit" id="reset-submit" class="btn btn-primary btn-block" style="margin-top:14px">
          <span data-i18n-ko="비밀번호 변경">Update password</span>
        </button>
      </form>

      <p style="font-size:12px;color:var(--color-neutral-500);text-align:center;margin:0">
        <a href="login.html" data-i18n-ko="로그인으로 돌아가기">Back to log in</a>
      </p>
    </div>
  </main>

  <script src="assets/vendor/supabase-js.js"></script>
  <script type="module">
    import { supabase } from './assets/supabase-client.js';
    import { initViewToggle } from './assets/view-toggle.js';
    import { initLangToggle } from './assets/i18n.js';

    initViewToggle();
    initLangToggle();

    function setMsg(el, text, kind) {
      el.textContent = text;
      el.className = 'form-msg' + (kind ? ' is-' + kind : '');
      el.hidden = !text;
    }

    const form = document.getElementById('reset-form');
    const submitBtn = document.getElementById('reset-submit');
    const resetMsg = document.getElementById('reset-msg');
    const introMsg = document.getElementById('intro-msg');

    // The reset-link redirect carries a recovery token in the URL; the
    // Supabase client parses it automatically and turns it into a session.
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      introMsg.textContent = 'This reset link is invalid or has expired.';
      form.hidden = true;
    }

    const pwInput = document.getElementById('new-password');
    const pwBox = document.getElementById('pw-requirements');

    function checkPassword(value) {
      const rules = {
        length: value.length >= 10,
        lower: /[a-z]/.test(value),
        upper: /[A-Z]/.test(value),
        number: /[0-9]/.test(value),
        special: /[^A-Za-z0-9]/.test(value),
      };
      const categoryCount = [rules.lower, rules.upper, rules.number, rules.special].filter(Boolean).length;
      for (const [rule, met] of Object.entries(rules)) {
        const li = pwBox.querySelector('[data-rule="' + rule + '"]');
        if (li) li.classList.toggle('is-met', met);
      }
      return rules.length && categoryCount >= 3;
    }

    pwInput.addEventListener('focus', () => { pwBox.style.display = 'block'; });
    pwInput.addEventListener('input', () => checkPassword(pwInput.value));

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = pwInput.value;

      setMsg(resetMsg, '', null);
      if (!checkPassword(password)) {
        pwBox.style.display = 'block';
        setMsg(resetMsg, 'Password does not meet the requirements above.', 'error');
        return;
      }

      submitBtn.disabled = true;
      const { error } = await supabase.auth.updateUser({ password });
      submitBtn.disabled = false;

      if (error) { setMsg(resetMsg, error.message, 'error'); return; }

      setMsg(resetMsg, 'Password updated — redirecting…', 'success');
      setTimeout(() => { window.location.href = 'booking.html'; }, 1200);
    });
  </script>

  <script type="module" src="assets/legal-footer.js"></script>
</body>
</html>
