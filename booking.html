<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fitin — PT Booking</title>
<script>try{var m=localStorage.getItem('fitin-view-mode');if(m)document.documentElement.dataset.viewMode=m;}catch(e){}</script>
<link rel="stylesheet" href="_ds/nocturne-80ca4b25-89f2-4e0d-accf-6f8bf2e523f1/styles.css">
<link rel="stylesheet" href="assets/view-toggle.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
  body { margin: 0; }
  a { color: var(--color-accent); }
  a:hover { color: var(--color-accent-300); }

  @media (max-width: 480px) {
    .intro-sub { font-size: 12px !important; }
  }

  .day-group { margin-bottom: 28px; }
  .day-heading {
    font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--color-neutral-500); margin: 0 0 10px;
  }
  .slot-row {
    display: grid; grid-template-columns: 1fr auto; align-items: center;
    gap: 12px; padding: 12px 14px; border-radius: var(--radius-md);
    background: var(--color-surface);
  }
  .slot-row + .slot-row { margin-top: 8px; }
  .slot-time { font-weight: 500; font-size: 14px; }
  .slot-trainer { font-size: 12px; color: var(--color-neutral-500); }

  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(0);
    z-index: 40; display: flex; align-items: center; gap: 10px; padding: 12px 18px;
    white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 180ms ease-out;
  }
  #toast.is-visible { opacity: 1; }
</style>
</head>
<body style="background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);min-height:100vh">

  <header style="position:sticky;top:0;z-index:20;backdrop-filter:blur(12px);background:color-mix(in srgb, var(--color-bg) 88%, transparent);border-bottom:1px solid var(--color-divider)">
    <div style="max-width:900px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px">
      <a href="Fitin%20Main.dc.html" style="display:flex;align-items:center;text-decoration:none">
        <img src="assets/logo.png" alt="Fitin Connection" style="height:36px;width:36px;border-radius:9px">
      </a>
      <div style="margin-left:auto;display:flex;align-items:center;gap:12px">
        <div id="lang-toggle-mount"></div>
        <div id="view-toggle-mount"></div>
        <span data-auth-guest>
          <a class="btn btn-secondary" href="login.html" data-i18n-ko="로그인">Log in</a>
        </span>
        <span data-auth-member hidden style="display:flex;gap:8px;align-items:center">
          <a class="tag tag-accent" href="mypage.html" style="text-decoration:none"><i class="ph ph-user" aria-hidden="true"></i><span data-auth-member-name>내 계정</span></a>
          <button class="btn btn-secondary" type="button" data-signout><i class="ph ph-sign-out" aria-hidden="true"></i><span data-i18n-ko="로그아웃">Log out</span></button>
        </span>
      </div>
    </div>
  </header>

  <main style="max-width:900px;margin:0 auto;padding:40px 24px 80px">
    <h1 style="font-size:28px;margin-bottom:4px" data-i18n-ko="PT 예약">PT Booking</h1>
    <p id="week-range" style="font-size:13px;color:var(--color-neutral-500);margin:0 0 8px"></p>
    <p class="intro-sub" style="font-size:14px;color:var(--color-neutral-500);margin:0 0 32px" data-i18n-ko="캘린더는 매주 일요일 오전 8시(KST)에 자동으로 다음 주로 갱신됩니다. 예약 기능은 현재 준비 중입니다.">
      The calendar refreshes to next week automatically every Sunday at 08:00 KST. Booking is coming soon — this is a preview of open slots.
    </p>

    <div id="slots"></div>
  </main>

  <div id="toast" class="card elev-lg">
    <i class="ph-fill ph-info" style="color:var(--color-accent)"></i><span id="toast-text" style="font-size:14px"></span>
  </div>

  <script src="assets/vendor/supabase-js.js"></script>
  <script type="module">
    import { initAuthNavigation } from './assets/auth-navigation.js';
    import { initViewToggle } from './assets/view-toggle.js';
    import { initLangToggle } from './assets/i18n.js';

    initViewToggle();
    initAuthNavigation();

    let toastTimer;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-text').textContent = msg;
      toast.classList.add('is-visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('is-visible'), 2600);
    }

    const SLOT_TIMES = ['10:00', '14:00', '17:00', '19:00'];
    const DAY_LABELS_EN = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const DAY_LABELS_KO = ['일', '월', '화', '수', '목', '금', '토'];

    // "This week" rolls over every Sunday 08:00 KST — find the most recent
    // such rollover and return that week's Monday, as KST wall-clock date parts.
    function getActiveWeekMonday() {
      const kstNow = new Date(Date.now() + 9 * 3600e3);
      const dow = kstNow.getUTCDay();
      const hour = kstNow.getUTCHours();
      const daysSinceRollover = dow === 0 && hour < 8 ? 7 : dow;
      const rolloverSunday = new Date(Date.UTC(
        kstNow.getUTCFullYear(), kstNow.getUTCMonth(), kstNow.getUTCDate() - daysSinceRollover
      ));
      return new Date(rolloverSunday.getTime() + 86400e3);
    }

    function formatDate(d, locale) {
      return d.toLocaleDateString(locale === 'ko' ? 'ko-KR' : 'en-US', { month: 'short', day: 'numeric' });
    }

    const monday = getActiveWeekMonday();
    const friday = new Date(monday.getTime() + 4 * 86400e3);

    const weekRangeEl = document.getElementById('week-range');
    weekRangeEl.textContent = `This week: ${formatDate(monday, 'en')} – ${formatDate(friday, 'en')} (Mon–Fri)`;
    weekRangeEl.dataset.i18nKo = `이번 주: ${formatDate(monday, 'ko')} – ${formatDate(friday, 'ko')} (월–금)`;

    const container = document.getElementById('slots');
    for (let i = 0; i < 5; i++) {
      const date = new Date(monday.getTime() + i * 86400e3);
      const dow = date.getUTCDay();

      const group = document.createElement('div');
      group.className = 'day-group';

      const heading = document.createElement('h2');
      heading.className = 'day-heading';
      heading.textContent = `${DAY_LABELS_EN[dow]} · ${formatDate(date, 'en')}`;
      heading.dataset.i18nKo = `${DAY_LABELS_KO[dow]} · ${formatDate(date, 'ko')}`;
      group.appendChild(heading);

      for (const time of SLOT_TIMES) {
        const row = document.createElement('div');
        row.className = 'slot-row';

        const info = document.createElement('div');
        info.innerHTML =
          `<div class="slot-time">${time}</div>` +
          `<div class="slot-trainer">Fitin Trainer</div>`;
        row.appendChild(info);

        const button = document.createElement('button');
        button.className = 'btn btn-primary';
        button.innerHTML = '<i class="ph ph-calendar-check"></i><span data-i18n-ko="예약하기">Book this slot</span>';
        button.addEventListener('click', () => {
          const lang = document.documentElement.lang === 'ko' ? 'ko' : 'en';
          showToast(lang === 'ko'
            ? '예약 기능은 곧 연결됩니다 — 지금은 미리보기예요.'
            : 'Booking isn’t connected yet — this is a preview.');
        });
        row.appendChild(button);

        group.appendChild(row);
      }

      container.appendChild(group);
    }

    // Re-translate the day headings and newly inserted buttons too.
    initLangToggle();
  </script>

</body>
</html>
