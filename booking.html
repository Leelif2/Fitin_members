<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fitin — PT Booking</title>
<script>try{var m=localStorage.getItem('fitin-view-mode');if(m)document.documentElement.dataset.viewMode=m;}catch(e){}</script>
<link rel="stylesheet" href="_ds/nocturne-80ca4b25-89f2-4e0d-accf-6f8bf2e523f1/styles.css">
<link rel="stylesheet" href="assets/view-toggle.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
  body { margin: 0; }
  [hidden] { display: none !important; }
  a { color: var(--color-accent); }
  a:hover { color: var(--color-accent-300); }

  @media (max-width: 480px) {
    .intro-sub { font-size: 12px !important; }
  }

  .day-group { margin-bottom: 28px; }
  .day-heading {
    font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--color-neutral-500); margin: 0 0 10px;
  }
  .slot-row {
    display: grid; grid-template-columns: 1fr auto; align-items: center;
    gap: 12px; padding: 12px 14px; border-radius: var(--radius-md);
    background: var(--color-surface);
  }
  .slot-row + .slot-row { margin-top: 8px; }
  .slot-time { font-weight: 500; font-size: 14px; }
  .slot-trainer { font-size: 12px; color: var(--color-neutral-500); }
  .slot-row.is-mine { box-shadow: inset 0 0 0 1.5px var(--color-text); }
  .slot-row.is-unavailable .slot-time { color: var(--color-neutral-500); }
  .slot-state { font-size: 12px; color: var(--color-neutral-500); }

  .my-booking {
    flex-direction: row; flex-wrap: wrap; align-items: center; gap: 12px 16px;
    padding: 16px 18px; margin-bottom: 32px;
  }
  .my-booking-label { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-neutral-500); }
  .my-booking-when { font-size: 18px; font-weight: 500; }
  .my-booking-note { font-size: 12px; color: var(--color-neutral-500); }
  .notice { display: block; font-size: 13px; color: var(--color-neutral-500); padding: 14px 16px; margin-bottom: 24px; }

  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(0);
    z-index: 40; display: flex; align-items: center; gap: 10px; padding: 12px 18px;
    white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 180ms ease-out;
  }
  #toast.is-visible { opacity: 1; }
</style>
</head>
<body style="background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);min-height:100vh">

  <header style="position:sticky;top:0;z-index:20;backdrop-filter:blur(12px);background:color-mix(in srgb, var(--color-bg) 88%, transparent);border-bottom:1px solid var(--color-divider)">
    <div style="max-width:900px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px">
      <a href="Fitin%20Main.dc.html" style="display:flex;align-items:center;text-decoration:none">
        <img src="assets/logo.png" alt="Fitin Connection" style="height:36px;width:36px;border-radius:9px">
      </a>
      <div style="margin-left:auto;display:flex;align-items:center;gap:12px">
        <div id="lang-toggle-mount"></div>
        <div id="view-toggle-mount"></div>
        <span data-auth-guest>
          <a class="btn btn-secondary" href="login.html" data-i18n-ko="로그인">Log in</a>
        </span>
        <span data-auth-member hidden style="display:flex;gap:8px;align-items:center">
          <a class="tag tag-accent" href="mypage.html" style="text-decoration:none"><i class="ph ph-user" aria-hidden="true"></i><span data-auth-member-name>내 계정</span></a>
          <button class="btn btn-secondary" type="button" data-signout><i class="ph ph-sign-out" aria-hidden="true"></i><span data-i18n-ko="로그아웃">Log out</span></button>
        </span>
      </div>
    </div>
  </header>

  <main style="max-width:900px;margin:0 auto;padding:40px 24px 80px">
    <h1 style="font-size:28px;margin-bottom:4px" data-i18n-ko="PT 예약">PT Booking</h1>
    <p id="week-range" style="font-size:13px;color:var(--color-neutral-500);margin:0 0 8px"></p>
    <p class="intro-sub" style="font-size:14px;color:var(--color-neutral-500);margin:0 0 32px" data-i18n-ko="월–금 17:00–22:00, 1시간 세션. 선착순이며 한 주에 한 번 예약할 수 있어요. 취소는 시작 24시간 전까지 가능합니다. 캘린더는 매주 일요일 오전 8시(KST)에 다음 주로 넘어갑니다.">
      Mon–Fri, 17:00–22:00, one-hour sessions. First come, first served — one booking per week. Cancel up to 24 hours before. The calendar moves to next week every Sunday at 08:00 KST.
    </p>

    <div id="notice"></div>
    <div id="my-booking"></div>
    <div id="slots"></div>
  </main>

  <div id="toast" class="card elev-lg">
    <i class="ph-fill ph-info" style="color:var(--color-accent)"></i><span id="toast-text" style="font-size:14px"></span>
  </div>

  <script src="assets/vendor/supabase-js.js"></script>
  <script type="module">
    import { initAuthNavigation } from './assets/auth-navigation.js';
    import { supabase } from './assets/supabase-client.js';
    import { initViewToggle } from './assets/view-toggle.js';
    import { initLangToggle } from './assets/i18n.js';

    initViewToggle();
    initAuthNavigation();

    let toastTimer;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-text').textContent = msg;
      toast.classList.add('is-visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('is-visible'), 2600);
    }

    const SLOT_TIMES = ['17:00', '18:00', '19:00', '20:00', '21:00'];
    const DAY_LABELS_EN = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const DAY_LABELS_KO = ['일', '월', '화', '수', '목', '금', '토'];

    // Error codes raised by book_pt_session / cancel_pt_reservation
    // (supabase/migrations/0008_pt_reservations.sql).
    const ERRORS = {
      not_signed_in: ['Please log in first.', '먼저 로그인해 주세요.'],
      no_profile: ['Only signed-up members can book.', '회원가입한 회원만 예약할 수 있어요.'],
      invalid_slot: ['That time can’t be booked.', '예약할 수 없는 시간이에요.'],
      outside_week: ['Only this week can be booked.', '이번 주 시간만 예약할 수 있어요.'],
      past_slot: ['That time has already passed.', '이미 지난 시간이에요.'],
      slot_taken: ['Someone just booked that slot.', '방금 다른 학생이 예약했어요.'],
      weekly_limit: ['You already have a booking this week.', '이번 주에 이미 예약이 있어요 (주 1회).'],
      not_found: ['Booking not found.', '예약을 찾을 수 없어요.'],
      too_late: ['Cancellations close 24 hours before the session.', '시작 24시간 이내라 취소할 수 없어요.'],
    };

    const isKo = () => document.documentElement.lang === 'ko';
    const tr = (en, ko) => (isKo() ? ko : en);

    // Creates an element whose text follows the EN/KO toggle (i18n.js reads
    // data-i18n-en / data-i18n-ko on every switch).
    function textEl(tag, className, en, ko) {
      const el = document.createElement(tag);
      if (className) el.className = className;
      el.dataset.i18nEn = en;
      el.dataset.i18nKo = ko;
      el.textContent = tr(en, ko);
      return el;
    }

    function errorText(error) {
      const code = Object.keys(ERRORS).find((k) => (error?.message || '').includes(k));
      const [en, ko] = code ? ERRORS[code] : ['Something went wrong. Please try again.', '문제가 생겼어요. 다시 시도해 주세요.'];
      return tr(en, ko);
    }

    // "This week" rolls over every Sunday 08:00 KST — find the most recent
    // such rollover and return that week's Monday, as KST wall-clock date parts.
    // Mirrors pt_active_week_start() in the database, which has the final say.
    function getActiveWeekMonday() {
      const kstNow = new Date(Date.now() + 9 * 3600e3);
      const dow = kstNow.getUTCDay();
      const hour = kstNow.getUTCHours();
      const daysSinceRollover = dow === 0 && hour < 8 ? 7 : dow;
      const rolloverSunday = new Date(Date.UTC(
        kstNow.getUTCFullYear(), kstNow.getUTCMonth(), kstNow.getUTCDate() - daysSinceRollover
      ));
      return new Date(rolloverSunday.getTime() + 86400e3);
    }

    function formatDate(d, locale) {
      return d.toLocaleDateString(locale === 'ko' ? 'ko-KR' : 'en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
    }

    const isoDate = (d) => d.toISOString().slice(0, 10);
    const hhmm = (t) => String(t).slice(0, 5);
    // Session start as a real instant: the date/time are KST wall-clock values.
    const startsAt = (date, time) => new Date(`${date}T${hhmm(time)}:00+09:00`);

    const monday = getActiveWeekMonday();
    const friday = new Date(monday.getTime() + 4 * 86400e3);

    const weekRangeEl = document.getElementById('week-range');
    weekRangeEl.textContent = `This week: ${formatDate(monday, 'en')} – ${formatDate(friday, 'en')} (Mon–Fri)`;
    weekRangeEl.dataset.i18nKo = `이번 주: ${formatDate(monday, 'ko')} – ${formatDate(friday, 'ko')} (월–금)`;

    const state = { session: null, taken: new Set(), mine: null, busy: false, ready: true };

    async function loadData() {
      const { data: { session } } = await supabase.auth.getSession();
      state.session = session;

      const taken = await supabase.rpc('get_pt_taken_slots');
      if (taken.error) {
        // Migration 0004 not run yet — show the schedule but keep booking off.
        state.ready = false;
        state.taken = new Set();
      } else {
        state.ready = true;
        state.taken = new Set(taken.data.map((r) => `${r.reservation_date} ${hhmm(r.start_time)}`));
      }

      state.mine = null;
      if (session && state.ready) {
        const { data } = await supabase
          .from('pt_reservations')
          .select('id, reservation_date, start_time, end_time')
          .eq('user_id', session.user.id)
          .eq('status', 'confirmed')
          .gte('reservation_date', isoDate(monday))
          .lte('reservation_date', isoDate(friday))
          .limit(1);
        state.mine = data && data[0] ? data[0] : null;
      }
    }

    function renderNotice() {
      const box = document.getElementById('notice');
      box.innerHTML = '';
      if (!state.ready) {
        box.appendChild(textEl('div', 'card notice',
          'Booking is being set up — check back soon.',
          '예약 시스템을 준비 중이에요. 잠시 후 다시 확인해 주세요.'));
      } else if (!state.session) {
        const n = document.createElement('div');
        n.className = 'card notice';
        n.appendChild(textEl('span', '', 'Only signed-up members can book. ', '회원가입한 회원만 예약할 수 있어요. '));
        const login = textEl('a', '', 'Log in', '로그인');
        login.href = 'login.html';
        n.appendChild(login);
        n.appendChild(document.createTextNode(' · '));
        const signup = textEl('a', '', 'Sign up', '회원가입');
        signup.href = 'signup.html';
        n.appendChild(signup);
        box.appendChild(n);
      }
    }

    function renderMine() {
      const box = document.getElementById('my-booking');
      box.innerHTML = '';
      if (!state.mine) return;
      const m = state.mine;
      const d = new Date(`${m.reservation_date}T00:00:00Z`);
      const dow = d.getUTCDay();
      const card = document.createElement('div');
      card.className = 'card my-booking';

      const info = document.createElement('div');
      info.style.flex = '1';
      info.appendChild(textEl('div', 'my-booking-label', 'My booking', '내 예약'));
      info.appendChild(textEl('div', 'my-booking-when',
        `${DAY_LABELS_EN[dow]} ${formatDate(d, 'en')} · ${hhmm(m.start_time)}–${hhmm(m.end_time)}`,
        `${formatDate(d, 'ko')} (${DAY_LABELS_KO[dow]}) · ${hhmm(m.start_time)}–${hhmm(m.end_time)}`));
      card.appendChild(info);

      const canCancel = startsAt(m.reservation_date, m.start_time).getTime() - Date.now() > 24 * 3600e3;
      if (canCancel) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'btn btn-secondary';
        btn.disabled = state.busy;
        btn.appendChild(textEl('span', '', 'Cancel booking', '예약 취소'));
        btn.addEventListener('click', () => cancelBooking(m));
        card.appendChild(btn);
      } else {
        card.appendChild(textEl('div', 'my-booking-note',
          'Within 24 hours — contact the trainer to change.',
          '시작 24시간 이내라 취소할 수 없어요. 변경은 트레이너에게 연락해 주세요.'));
      }
      box.appendChild(card);
    }

    function renderSlots() {
      const container = document.getElementById('slots');
      container.innerHTML = '';
      const now = Date.now();

      for (let i = 0; i < 5; i++) {
        const date = new Date(monday.getTime() + i * 86400e3);
        const dateStr = isoDate(date);
        const dow = date.getUTCDay();

        const group = document.createElement('div');
        group.className = 'day-group';
        group.appendChild(textEl('h2', 'day-heading',
          `${DAY_LABELS_EN[dow]} · ${formatDate(date, 'en')}`,
          `${DAY_LABELS_KO[dow]} · ${formatDate(date, 'ko')}`));

        for (const time of SLOT_TIMES) {
          const key = `${dateStr} ${time}`;
          const end = `${String(Number(time.slice(0, 2)) + 1).padStart(2, '0')}:00`;
          const isMine = state.mine && `${state.mine.reservation_date} ${hhmm(state.mine.start_time)}` === key;
          const isPast = startsAt(dateStr, time).getTime() <= now;

          const row = document.createElement('div');
          row.className = 'slot-row';

          const info = document.createElement('div');
          const t = document.createElement('div');
          t.className = 'slot-time';
          t.textContent = `${time}–${end}`;
          info.appendChild(t);
          info.appendChild(textEl('div', 'slot-trainer', 'Fitin Trainer · 60 min', 'Fitin 트레이너 · 60분'));
          row.appendChild(info);

          if (isMine) {
            row.classList.add('is-mine');
            row.appendChild(textEl('span', 'tag tag-neutral', 'My booking', '내 예약'));
          } else if (isPast) {
            row.classList.add('is-unavailable');
            row.appendChild(textEl('span', 'slot-state', 'Passed', '지난 시간'));
          } else if (state.taken.has(key)) {
            // Booked by someone else — who it is is never sent to the browser.
            row.classList.add('is-unavailable');
            row.appendChild(textEl('span', 'slot-state', 'Booked', '마감'));
          } else {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'btn btn-primary';
            button.innerHTML = '<i class="ph ph-calendar-check"></i>';
            button.appendChild(textEl('span', '', 'Book', '예약하기'));
            // One booking per week: other open slots stay visible but locked.
            button.disabled = !state.ready || state.busy || !!(state.session && state.mine);
            button.addEventListener('click', () => book(dateStr, time, date, dow));
            row.appendChild(button);
          }

          group.appendChild(row);
        }
        container.appendChild(group);
      }
    }

    function render() {
      renderNotice();
      renderMine();
      renderSlots();
    }

    async function refresh() {
      await loadData();
      render();
    }

    async function book(dateStr, time, date, dow) {
      if (!state.session) {
        window.location.href = 'login.html';
        return;
      }
      const label = tr(`${DAY_LABELS_EN[dow]} ${formatDate(date, 'en')} ${time}`, `${formatDate(date, 'ko')} (${DAY_LABELS_KO[dow]}) ${time}`);
      if (!window.confirm(tr(`Book ${label}? (one booking per week)`, `${label} 세션을 예약할까요? (주 1회)`))) return;

      state.busy = true;
      render();
      const { error } = await supabase.rpc('book_pt_session', { p_date: dateStr, p_start: time });
      state.busy = false;
      showToast(error ? errorText(error) : tr('Booked! See you there.', '예약 완료! 그 시간에 만나요.'));
      await refresh();
    }

    async function cancelBooking(m) {
      if (!window.confirm(tr('Cancel this booking?', '이 예약을 취소할까요?'))) return;
      state.busy = true;
      render();
      const { error } = await supabase.rpc('cancel_pt_reservation', { p_id: m.id });
      state.busy = false;
      showToast(error ? errorText(error) : tr('Booking cancelled.', '예약을 취소했어요.'));
      await refresh();
    }

    // A tab left open goes stale (slots fill up, time passes) — reload on return.
    document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });

    // Sets the page language first so the slots below render in it.
    initLangToggle();
    render();
    await refresh();
  </script>

</body>
</html>
