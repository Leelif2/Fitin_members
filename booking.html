<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fitin - PT Booking</title>
<script>try{var m=localStorage.getItem('fitin-view-mode');if(m)document.documentElement.dataset.viewMode=m;}catch(e){}</script>
<link rel="stylesheet" href="_ds/nocturne-80ca4b25-89f2-4e0d-accf-6f8bf2e523f1/styles.css">
<link rel="stylesheet" href="assets/view-toggle.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
  body { margin: 0; }
  a { color: var(--color-accent); }
  a:hover { color: var(--color-accent-300); }
  .booking-shell { max-width: 980px; margin: 0 auto; padding: 40px 24px 80px; }
  .booking-heading { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 24px; }
  .booking-heading h1 { font-size: 30px; margin: 0 0 6px; }
  .booking-heading p { color: var(--color-neutral-500); font-size: 14px; margin: 0; }
  .week-controls { display: flex; align-items: center; gap: 8px; }
  .week-label { min-width: 150px; text-align: center; font-size: 13px; color: var(--color-neutral-400); }
  .schedule { display: grid; grid-template-columns: repeat(7, minmax(126px, 1fr)); gap: 10px; overflow-x: auto; padding-bottom: 8px; }
  .day-column { min-width: 126px; border: 1px solid var(--color-divider); background: var(--color-surface); }
  .day-heading { padding: 14px; border-bottom: 1px solid var(--color-divider); }
  .day-heading strong { display: block; font-size: 14px; margin-bottom: 2px; }
  .day-heading span { color: var(--color-neutral-500); font-size: 12px; }
  .slot { padding: 10px; border-bottom: 1px solid var(--color-divider); }
  .slot:last-child { border-bottom: 0; }
  .slot-time { display: block; font-size: 13px; margin-bottom: 8px; }
  .slot button { width: 100%; min-height: 34px; padding: 7px 8px; font-size: 12px; }
  .slot button:disabled { cursor: not-allowed; opacity: .48; }
  .booking-note { margin: 18px 0 0; color: var(--color-neutral-500); font-size: 13px; }
  .booking-message { min-height: 20px; margin: 12px 0 0; font-size: 13px; color: var(--color-neutral-500); }
  .booking-message.is-error { color: #e5484d; }
  .booking-message.is-success { color: #47a66b; }
  .empty-state { padding: 32px; border: 1px solid var(--color-divider); color: var(--color-neutral-500); text-align: center; }
  @media (max-width: 620px) {
    .booking-shell { padding: 30px 16px 64px; }
    .booking-heading { align-items: start; flex-direction: column; }
    .week-controls { width: 100%; justify-content: space-between; }
  }
</style>
</head>
<body style="background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);min-height:100vh">
  <header style="position:sticky;top:0;z-index:20;backdrop-filter:blur(12px);background:color-mix(in srgb, var(--color-bg) 88%, transparent);border-bottom:1px solid var(--color-divider)">
    <div style="max-width:1180px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px">
      <a href="Fitin%20Main.dc.html" style="display:flex;align-items:center;text-decoration:none"><img src="assets/logo.png" alt="Fitin Connection" style="height:36px;width:36px;border-radius:9px"></a>
      <div style="margin-left:auto;display:flex;align-items:center;gap:12px">
        <div id="lang-toggle-mount"></div>
        <div id="view-toggle-mount"></div>
        <span data-auth-guest><a class="btn btn-secondary" href="login.html" data-i18n-ko="로그인">Log in</a></span>
        <span data-auth-member hidden style="display:flex;gap:8px;align-items:center">
          <a class="tag tag-accent" href="mypage.html" style="text-decoration:none"><i class="ph ph-user" aria-hidden="true"></i><span data-auth-member-name>My account</span></a>
          <button class="btn btn-secondary" type="button" data-signout><i class="ph ph-sign-out" aria-hidden="true"></i><span data-i18n-ko="로그아웃">Log out</span></button>
        </span>
      </div>
    </div>
  </header>

  <main class="booking-shell">
    <div class="booking-heading">
      <div>
        <h1 data-i18n-ko="PT 예약">PT Booking</h1>
        <p data-i18n-ko="매일 오후 5시부터 9시까지, 한 번에 한 시간씩 예약할 수 있습니다.">Book one-hour sessions every day from 17:00 to 21:00.</p>
      </div>
      <div class="week-controls">
        <button class="btn btn-ghost" id="previous-week" type="button" aria-label="Previous week" title="Previous week"><i class="ph ph-caret-left" aria-hidden="true"></i></button>
        <span class="week-label" id="week-label"></span>
        <button class="btn btn-ghost" id="next-week" type="button" aria-label="Next week" title="Next week"><i class="ph ph-caret-right" aria-hidden="true"></i></button>
      </div>
    </div>
    <div class="schedule" id="schedule" aria-live="polite"></div>
    <p class="booking-note" data-i18n-ko="회원당 같은 주에는 PT를 한 번만 예약할 수 있습니다. 이미 예약된 시간은 다른 회원에게 예약 완료로 표시됩니다.">Each member may book one PT session per week. Reserved times are unavailable to other members.</p>
    <p class="booking-message" id="booking-message" role="status" aria-live="polite"></p>
  </main>

  <script src="assets/vendor/supabase-js.js"></script>
  <script type="module">
    import { supabase, requireSession } from './assets/supabase-client.js';
    import { initAuthNavigation } from './assets/auth-navigation.js';
    import { initViewToggle } from './assets/view-toggle.js';
    import { initLangToggle } from './assets/i18n.js';

    initViewToggle();
    initLangToggle();
    initAuthNavigation();

    const session = await requireSession();
    const schedule = document.getElementById('schedule');
    const message = document.getElementById('booking-message');
    const weekLabel = document.getElementById('week-label');
    const previousWeek = document.getElementById('previous-week');
    const nextWeek = document.getElementById('next-week');
    const kstOffset = 9 * 60 * 60 * 1000;
    const slotHours = [17, 18, 19, 20];
    let weekStart = getWeekStart(new Date());

    function getWeekStart(date) {
      const kst = new Date(date.getTime() + kstOffset);
      const day = kst.getUTCDay();
      const mondayOffset = day === 0 ? -6 : 1 - day;
      return new Date(Date.UTC(kst.getUTCFullYear(), kst.getUTCMonth(), kst.getUTCDate() + mondayOffset));
    }

    function slotDate(dayIndex, hour) {
      return new Date(Date.UTC(weekStart.getUTCFullYear(), weekStart.getUTCMonth(), weekStart.getUTCDate() + dayIndex, hour - 9));
    }

    function dateLabel(date) {
      return new Intl.DateTimeFormat(document.documentElement.lang === 'ko' ? 'ko-KR' : 'en-US', { month: 'short', day: 'numeric' }).format(date);
    }

    function text(ko, en) {
      return document.documentElement.lang === 'ko' ? ko : en;
    }

    function setMessage(text, kind = '') {
      message.textContent = text;
      message.className = 'booking-message' + (kind ? ' is-' + kind : '');
    }

    function friendlyError(error) {
      const text = error.message || '';
      if (error.code === '23505') return '방금 다른 회원이 이 시간을 예약했습니다. 새로고침 후 다시 선택해 주세요.';
      if (text.includes('Only one PT booking')) return '같은 주에는 PT를 한 번만 예약할 수 있습니다.';
      return text || '예약을 처리하지 못했습니다. 잠시 후 다시 시도해 주세요.';
    }

    async function loadWeek() {
      if (!session) return;
      setMessage('');
      schedule.innerHTML = `<div class="empty-state">${text('예약 시간을 불러오는 중입니다...', 'Loading schedule...')}</div>`;
      const start = new Date(weekStart.getTime() - kstOffset).toISOString();
      const end = new Date(weekStart.getTime() + 7 * 86400000 - kstOffset).toISOString();
      const [{ data: slots, error: slotsError }, { data: bookings, error: bookingsError }] = await Promise.all([
        supabase.from('pt_slots_public').select('id, starts_at, ends_at, trainer, is_booked').gte('starts_at', start).lt('starts_at', end),
        supabase.from('bookings').select('id, slot_id').eq('user_id', session.user.id),
      ]);
      if (slotsError || bookingsError) {
        schedule.innerHTML = `<div class="empty-state">${text('PT 예약 시간을 불러오지 못했습니다.', 'Unable to load the PT schedule.')}</div>`;
        setMessage((slotsError || bookingsError).message, 'error');
        return;
      }
      renderWeek(slots || [], bookings || []);
    }

    function renderWeek(slots, bookings) {
      const slotsByTime = new Map(slots.map((slot) => [new Date(slot.starts_at).getTime(), slot]));
      const ownBookingBySlot = new Map(bookings.map((booking) => [booking.slot_id, booking]));
      const ownBookingThisWeek = bookings.some((booking) => slots.some((slot) => slot.id === booking.slot_id));
      const now = Date.now();
      const dayNames = document.documentElement.lang === 'ko'
        ? ['월', '화', '수', '목', '금', '토', '일']
        : ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
      weekLabel.textContent = `${dateLabel(new Date(weekStart.getTime() + 9 * 3600000))} - ${dateLabel(new Date(weekStart.getTime() + 6 * 86400000 + 9 * 3600000))}`;
      const currentWeek = getWeekStart(new Date());
      previousWeek.disabled = weekStart <= currentWeek;
      nextWeek.disabled = weekStart >= new Date(currentWeek.getTime() + 7 * 7 * 86400000);
      schedule.innerHTML = '';

      for (let dayIndex = 0; dayIndex < 7; dayIndex++) {
        const dayDate = new Date(weekStart.getTime() + dayIndex * 86400000 + 9 * 3600000);
        const column = document.createElement('section');
        column.className = 'day-column';
        column.innerHTML = `<div class="day-heading"><strong>${dayNames[dayIndex]}</strong><span>${dateLabel(dayDate)}</span></div>`;
        for (const hour of slotHours) {
          const startAt = slotDate(dayIndex, hour);
          const slot = slotsByTime.get(startAt.getTime());
          const ownBooking = slot && ownBookingBySlot.get(slot.id);
          const row = document.createElement('div');
          row.className = 'slot';
          const time = document.createElement('span');
          time.className = 'slot-time';
          time.textContent = `${String(hour).padStart(2, '0')}:00 - ${String(hour + 1).padStart(2, '0')}:00`;
          row.appendChild(time);
          const button = document.createElement('button');
          button.className = ownBooking ? 'btn btn-secondary' : 'btn btn-primary';

          if (!slot) {
            button.textContent = text('예약 불가', 'Unavailable');
            button.disabled = true;
          } else if (ownBooking) {
            button.textContent = text('예약 취소', 'Cancel booking');
            button.addEventListener('click', () => cancelBooking(ownBooking.id));
          } else if (startAt.getTime() <= now) {
            button.textContent = text('마감', 'Closed');
            button.disabled = true;
          } else if (slot.is_booked) {
            button.textContent = text('예약 완료', 'Booked');
            button.disabled = true;
          } else if (ownBookingThisWeek) {
            button.textContent = text('주 1회 예약 완료', 'Weekly limit reached');
            button.disabled = true;
          } else {
            button.textContent = text('예약하기', 'Book');
            button.addEventListener('click', () => createBooking(slot.id));
          }
          row.appendChild(button);
          column.appendChild(row);
        }
        schedule.appendChild(column);
      }
    }

    async function createBooking(slotId) {
      setMessage('');
      const { error } = await supabase.from('bookings').insert({ slot_id: slotId, user_id: session.user.id });
      if (error) {
        setMessage(friendlyError(error), 'error');
        await loadWeek();
        return;
      }
      setMessage(text('PT 예약이 완료되었습니다.', 'PT reservation confirmed.'), 'success');
      await loadWeek();
    }

    async function cancelBooking(bookingId) {
      setMessage('');
      const { error } = await supabase.from('bookings').delete().eq('id', bookingId);
      if (error) {
        setMessage(friendlyError(error), 'error');
        return;
      }
      setMessage(text('PT 예약을 취소했습니다.', 'PT reservation cancelled.'), 'success');
      await loadWeek();
    }

    previousWeek.addEventListener('click', () => {
      weekStart = new Date(weekStart.getTime() - 7 * 86400000);
      loadWeek();
    });
    nextWeek.addEventListener('click', () => {
      weekStart = new Date(weekStart.getTime() + 7 * 86400000);
      loadWeek();
    });
    window.addEventListener('fitin:lang-change', loadWeek);
    loadWeek();
  </script>
</body>
</html>
