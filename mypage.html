<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fitin - My Page</title>
<script>try{var t=localStorage.getItem('fitin-theme');if(t)document.documentElement.dataset.theme=t;var m=localStorage.getItem('fitin-view-mode');if(m)document.documentElement.dataset.viewMode=m;}catch(e){}</script>
<link rel="stylesheet" href="_ds/nocturne-80ca4b25-89f2-4e0d-accf-6f8bf2e523f1/styles.css">
<link rel="stylesheet" href="assets/view-toggle.css">
<link rel="stylesheet" href="assets/membership.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
  body { margin: 0; }
  a { color: var(--color-accent); }
  a:hover { color: var(--color-accent-300); }
  .profile-shell { max-width: 860px; margin: 0 auto; padding: 48px 24px 80px; }
  .profile-heading { display: flex; justify-content: space-between; gap: 20px; align-items: end; margin-bottom: 28px; }
  .profile-heading h1 { font-size: 30px; margin: 0 0 6px; }
  .profile-heading p { color: var(--color-neutral-500); font-size: 14px; margin: 0; }
  .profile-panel { border: 1px solid var(--color-divider); background: var(--color-surface); padding: 24px; }
  .profile-intro { display: flex; align-items: center; gap: 14px; padding-bottom: 22px; border-bottom: 1px solid var(--color-divider); }
  .profile-avatar { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%; background: var(--color-accent-800); color: var(--color-accent-100); font-size: 23px; }
  .profile-name { font-family: var(--font-heading); font-size: 19px; font-weight: 600; margin: 0 0 3px; }
  .profile-email { color: var(--color-neutral-500); font-size: 13px; margin: 0; overflow-wrap: anywhere; }
  .profile-details { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 24px; margin: 20px 0; }
  .profile-detail { padding: 15px 0; border-bottom: 1px solid var(--color-divider); }
  .profile-detail dt { color: var(--color-neutral-500); font-size: 12px; margin-bottom: 5px; }
  .profile-detail dd { font-size: 15px; margin: 0; overflow-wrap: anywhere; }
  .profile-actions { display: flex; justify-content: flex-end; gap: 8px; padding-top: 20px; }
  .profile-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--color-divider); }
  .profile-form[hidden], #edit-profile[hidden] { display: none !important; }
  .profile-form .form-actions { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: 8px; }
  .profile-check { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; }
  .profile-check input { width: 18px; height: 18px; accent-color: var(--color-accent); }
  .profile-message { min-height: 20px; margin: 14px 0 0; font-size: 13px; color: var(--color-neutral-500); }
  .profile-message.is-error { color: #f0868b; }
  .profile-message.is-success { color: #7cc99a; }
  @media (max-width: 560px) {
    .profile-shell { padding: 32px 16px 64px; }
    .profile-heading { align-items: start; flex-direction: column; }
    .profile-panel { padding: 18px; }
    .profile-details, .profile-form { grid-template-columns: 1fr; }
  }
</style>
</head>
<body style="background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);min-height:100vh">
  <header style="position:sticky;top:0;z-index:20;backdrop-filter:blur(12px);background:color-mix(in srgb, var(--color-bg) 88%, transparent);border-bottom:1px solid var(--color-divider)">
    <div style="max-width:1180px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px">
      <a href="Fitin%20Main.dc.html" style="display:flex;align-items:center;text-decoration:none"><img src="assets/logo.png" alt="Fitin Connection" style="height:40px;width:40px;border-radius:50%;box-shadow:0 0 0 1px color-mix(in srgb, var(--color-accent) 60%, transparent)"></a>
      <nav style="display:flex;gap:4px;flex-wrap:wrap">
        <a class="btn btn-ghost" href="Fitin%20Main.dc.html" data-i18n-ko="홈">Home</a>
        <a class="btn btn-ghost" href="booking.html" data-i18n-ko="PT 예약">PT Booking</a>
        <a class="btn btn-ghost" href="membership.html" data-i18n-ko="멤버십">Membership</a>
        <a class="btn btn-ghost" href="calendar.html" data-i18n-ko="캘린더">Calendar</a>
        <a class="btn btn-ghost" id="admin-link" href="admin.html" hidden><i class="ph ph-shield-check" aria-hidden="true"></i><span data-i18n-ko="관리">Admin</span></a>
      </nav>
      <div style="margin-left:auto;display:flex;align-items:center;gap:12px">
        <div id="lang-toggle-mount"></div>
        <div id="view-toggle-mount"></div>
        <span class="tag tag-accent"><i class="ph ph-user" aria-hidden="true"></i><span id="header-account">My account</span></span>
        <button class="btn btn-secondary" id="signout-button" type="button"><i class="ph ph-sign-out" aria-hidden="true"></i><span data-i18n-ko="로그아웃">Log out</span></button>
      </div>
    </div>
  </header>

  <main class="profile-shell">
    <div class="profile-heading">
      <div>
        <h1 data-i18n-ko="마이페이지">My Page</h1>
        <p data-i18n-ko="내 계정 정보를 확인하고 수정할 수 있습니다.">Review and update your account details.</p>
      </div>
    </div>

    <section class="profile-panel" aria-labelledby="profile-title">
      <div class="profile-intro">
        <div class="profile-avatar"><i class="ph ph-user" aria-hidden="true"></i></div>
        <div>
          <h2 class="profile-name" id="profile-title">-</h2>
          <p class="profile-email" id="profile-email">-</p>
        </div>
      </div>

      <dl class="profile-details">
        <div class="profile-detail"><dt data-i18n-ko="이름">Name</dt><dd id="detail-name">-</dd></div>
        <div class="profile-detail"><dt data-i18n-ko="닉네임">Nickname</dt><dd id="detail-nickname">-</dd></div>
        <div class="profile-detail"><dt data-i18n-ko="접속 중 표시">Online status</dt><dd id="detail-presence">-</dd></div>
        <div class="profile-detail"><dt data-i18n-ko="학교">School</dt><dd id="detail-university">-</dd></div>
        <div class="profile-detail"><dt data-i18n-ko="성별">Gender</dt><dd id="detail-gender">-</dd></div>
        <div class="profile-detail"><dt data-i18n-ko="가입일">Member since</dt><dd id="detail-created">-</dd></div>
      </dl>

      <div class="profile-actions"><button class="btn btn-primary" id="edit-profile" type="button"><i class="ph ph-pencil-simple" aria-hidden="true"></i><span data-i18n-ko="정보 수정">Edit profile</span></button></div>

      <form class="profile-form" id="profile-form" hidden>
        <div class="field">
          <label for="profile-name" data-i18n-ko="이름">Name</label>
          <input class="input" id="profile-name" maxlength="80" required>
        </div>
        <div class="field">
          <label for="profile-nickname" data-i18n-ko="닉네임">Nickname</label>
          <input class="input" id="profile-nickname" maxlength="12" autocomplete="nickname" placeholder="2–12 letters, numbers or _" data-i18n-ko-placeholder="2~12자 · 한글·영문·숫자·_">
        </div>
        <div class="field">
          <label for="profile-university" data-i18n-ko="학교">School</label>
          <input class="input" id="profile-university" maxlength="120" required>
        </div>
        <div class="field">
          <label for="profile-gender" data-i18n-ko="성별">Gender</label>
          <select class="input" id="profile-gender" required>
            <option value="male" data-i18n-ko="남성">Male</option>
            <option value="female" data-i18n-ko="여성">Female</option>
            <option value="undisclosed" data-i18n-ko="선택 안 함">Prefer not to say</option>
          </select>
        </div>
        <label class="profile-check"><input type="checkbox" id="profile-presence"><span data-i18n-ko="실시간 모임에서 다른 회원에게 내 접속 상태(닉네임) 보이기">Show other members my nickname when I'm online in live meetups</span></label>
        <div class="form-actions">
          <button class="btn btn-ghost" id="cancel-edit" type="button" data-i18n-ko="취소">Cancel</button>
          <button class="btn btn-primary" type="submit"><i class="ph ph-check" aria-hidden="true"></i><span data-i18n-ko="저장">Save</span></button>
        </div>
      </form>
      <p class="profile-message" id="profile-message" role="status" aria-live="polite"></p>
    </section>

    <!-- 내 멤버십 (assets/my-membership.js가 채움) -->
    <section class="profile-panel" id="membership-panel" style="margin-top:24px" aria-live="polite"></section>
  </main>

  <script src="assets/vendor/supabase-js.js"></script>
  <script type="module">
    import { supabase, requireSession, signOut } from './assets/supabase-client.js';
    import { initViewToggle } from './assets/view-toggle.js';
    import { initLangToggle } from './assets/i18n.js';
    import { initMyMembership } from './assets/my-membership.js';

    initViewToggle();
    initLangToggle();

    const session = await requireSession();
    if (session) initMyMembership(document.getElementById('membership-panel'));
    const form = document.getElementById('profile-form');
    const message = document.getElementById('profile-message');
    let profile = null;

    const genderLabel = (value) => {
      const labels = document.documentElement.lang === 'ko'
        ? { male: '남성', female: '여성', undisclosed: '선택 안 함' }
        : { male: 'Male', female: 'Female', undisclosed: 'Prefer not to say' };
      return labels[value] || '-';
    };
    const display = (value) => value || '-';

    function setMessage(text, kind = '') {
      message.textContent = text;
      message.className = 'profile-message' + (kind ? ' is-' + kind : '');
    }

    function renderProfile() {
      const fallback = session.user.user_metadata || {};
      const name = profile?.first_name || fallback.first_name || '-';
      const email = session.user.email || '-';
      document.getElementById('header-account').textContent = email.split('@')[0] || 'My account';
      document.getElementById('profile-title').textContent = name;
      document.getElementById('profile-email').textContent = email;
      document.getElementById('detail-name').textContent = name;
      document.getElementById('detail-university').textContent = display(profile?.university || fallback.university);
      document.getElementById('detail-gender').textContent = genderLabel(profile?.gender || fallback.gender);
      const ko = document.documentElement.lang === 'ko';
      document.getElementById('detail-nickname').textContent = display(profile?.nickname);
      document.getElementById('detail-presence').textContent = profile?.show_presence === false
        ? (ko ? '숨김' : 'Hidden') : (ko ? '보이기' : 'Shown');
      document.getElementById('profile-nickname').value = profile?.nickname || '';
      document.getElementById('profile-presence').checked = profile?.show_presence !== false;
      document.getElementById('detail-created').textContent = profile?.created_at
        ? new Date(profile.created_at).toLocaleDateString()
        : '-';
      document.getElementById('admin-link').hidden = profile?.role !== 'admin';
      document.getElementById('profile-name').value = profile?.first_name || fallback.first_name || '';
      document.getElementById('profile-university').value = profile?.university || fallback.university || '';
      document.getElementById('profile-gender').value = profile?.gender || fallback.gender || 'undisclosed';
    }

    if (session) {
      const { data, error } = await supabase
        .from('profiles')
        .select('first_name, university, gender, created_at, role, nickname, show_presence')
        .eq('id', session.user.id)
        .maybeSingle();
      if (error) setMessage(error.message, 'error');
      profile = data;
      renderProfile();
    }

    window.addEventListener('fitin:lang-change', renderProfile);

    document.getElementById('edit-profile').addEventListener('click', () => {
      form.hidden = false;
      document.getElementById('edit-profile').hidden = true;
      document.getElementById('profile-name').focus();
    });

    document.getElementById('cancel-edit').addEventListener('click', () => {
      form.hidden = true;
      document.getElementById('edit-profile').hidden = false;
      renderProfile();
      setMessage('');
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const submit = form.querySelector('[type="submit"]');
      submit.disabled = true;
      const updates = {
        id: session.user.id,
        first_name: document.getElementById('profile-name').value.trim(),
        university: document.getElementById('profile-university').value.trim(),
        gender: document.getElementById('profile-gender').value,
      };
      const ko = document.documentElement.lang === 'ko';
      const nickname = document.getElementById('profile-nickname').value.trim();
      const showPresence = document.getElementById('profile-presence').checked;
      if (nickname && !/^[0-9A-Za-z_가-힣]{2,12}$/.test(nickname)) {
        submit.disabled = false;
        setMessage(ko ? '닉네임은 2~12자의 한글·영문·숫자·_ 만 쓸 수 있어요.' : 'Nicknames are 2–12 letters, numbers or _.', 'error');
        return;
      }
      const { error } = await supabase.from('profiles').upsert(updates, { onConflict: 'id' });
      if (error) {
        submit.disabled = false;
        setMessage(error.message, 'error');
        return;
      }
      // 닉네임·접속 표시는 중복 확인을 하는 함수로 저장 (0025)
      const live = await supabase.rpc('set_my_live_profile', { p_nickname: nickname || null, p_show: showPresence });
      submit.disabled = false;
      if (live.error) {
        const taken = (live.error.message || '').includes('nickname_taken');
        setMessage(taken
          ? (ko ? '이미 쓰이고 있는 닉네임이에요.' : 'That nickname is taken.')
          : (ko ? '닉네임을 저장하지 못했어요.' : 'Couldn’t save your nickname.'), 'error');
        profile = { ...profile, ...updates };
        return;
      }
      profile = { ...profile, ...updates, nickname: live.data.nickname, show_presence: live.data.show_presence };
      renderProfile();
      form.hidden = true;
      document.getElementById('edit-profile').hidden = false;
      setMessage('Profile saved.', 'success');
    });

    document.getElementById('signout-button').addEventListener('click', signOut);
  </script>
  <script type="module" src="assets/legal-footer.js"></script>
</body>
</html>
