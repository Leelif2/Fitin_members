<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fitin — Sign in</title>
<script>try{var m=localStorage.getItem('fitin-view-mode');if(m)document.documentElement.dataset.viewMode=m;}catch(e){}</script>
<link rel="stylesheet" href="_ds/nocturne-80ca4b25-89f2-4e0d-accf-6f8bf2e523f1/styles.css">
<link rel="stylesheet" href="assets/view-toggle.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
  body { margin: 0; }
  a { color: var(--color-accent); }
  a:hover { color: var(--color-accent-300); }

  .panel-login { display: flex; flex-direction: column; gap: 14px; }
  [hidden] { display: none !important; }
  .form-msg { font-size: 12px; margin: -4px 0 0; }
  .form-msg.is-error { color: #f0868b; }
  .form-msg.is-success { color: var(--color-accent); }
  .btn[disabled] { pointer-events: none; }

</style>
</head>
<body style="background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);min-height:100vh">

  <header style="position:sticky;top:0;z-index:20;backdrop-filter:blur(12px);background:color-mix(in srgb, var(--color-bg) 88%, transparent);border-bottom:1px solid var(--color-divider)">
    <div style="max-width:1180px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px">
      <a href="Fitin%20Main.dc.html" style="display:flex;align-items:center;text-decoration:none">
        <img src="assets/logo.png" alt="Fitin Connection" style="height:40px;width:40px;border-radius:50%;box-shadow:0 0 0 1px color-mix(in srgb, var(--color-accent) 60%, transparent)">
      </a>
      <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
        <div id="lang-toggle-mount"></div>
        <div id="view-toggle-mount"></div>
      </div>
    </div>
  </header>

  <main style="max-width:1180px;margin:0 auto;padding:56px 24px 80px;display:flex;justify-content:center">
    <div class="auth-card card elev-md" style="width:min(420px,100%);padding:28px">

      <div style="text-align:center;margin-bottom:8px">
        <h1 style="font-size:26px;margin-bottom:6px" data-i18n-ko="Fitin에 오신 것을 환영합니다">Welcome to Fitin</h1>
        <p style="font-size:13px;color:var(--color-neutral-500);margin:0" data-i18n-ko="시간표를 올리고 공강에 맞는 운동 루틴을 받아보세요.">Upload your timetable and get a routine for every gap.</p>
      </div>

      <a class="btn btn-secondary btn-block" href="signup.html" data-signup-window target="fitin-signup"><i class="ph ph-user-plus" aria-hidden="true"></i><span data-i18n-ko="회원가입">Sign up</span></a>

      <form id="login-form" class="panel-login">
        <div class="field">
          <label for="login-email" data-i18n-ko="학교 이메일">School email</label>
          <input class="input" type="email" id="login-email" placeholder="you@university.edu" required>
        </div>
        <div class="field">
          <label for="login-password" data-i18n-ko="비밀번호">Password</label>
          <input class="input" type="password" id="login-password" placeholder="••••••••" required>
        </div>
        <div style="display:flex;justify-content:flex-end">
          <button type="button" id="forgot-toggle" class="btn btn-ghost" style="font-size:12px;padding:0" data-i18n-ko="비밀번호를 잊으셨나요?">Forgot password?</button>
        </div>
        <div id="forgot-box" hidden style="display:flex;flex-direction:column;gap:8px;padding:12px;background:var(--color-surface);border-radius:var(--radius-md)">
          <p style="font-size:12px;margin:0;color:var(--color-neutral-500)" data-i18n-ko="이메일을 입력하시면 재설정 링크를 보내드립니다.">Enter your email and we'll send a reset link.</p>
          <input class="input" type="email" id="forgot-email" placeholder="you@university.edu">
          <button type="button" id="forgot-send" class="btn btn-secondary btn-block" style="font-size:13px" data-i18n-ko="재설정 링크 보내기">Send reset link</button>
          <p id="forgot-msg" class="form-msg" hidden></p>
        </div>
        <p id="login-msg" class="form-msg" hidden></p>
        <button type="submit" id="login-submit" class="btn btn-primary btn-block">
          <i class="ph ph-sign-in"></i><span data-i18n-ko="로그인">Log in</span>
        </button>
        <div class="hr"></div>
        <p style="font-size:12px;color:var(--color-neutral-500);text-align:center;margin:0"><a href="signup.html" data-signup-window target="fitin-signup" data-i18n-ko="아직 계정이 없으신가요? 회원가입">No account yet? Sign up</a></p>
      </form>


    </div>
  </main>

  <script src="assets/signup-window.js" defer></script>
  <script src="assets/vendor/supabase-js.js"></script>
  <script type="module">
    import { supabase, requestPasswordReset, logEvent, afterSignIn } from './assets/supabase-client.js';
    import { initViewToggle } from './assets/view-toggle.js';
    import { initLangToggle } from './assets/i18n.js';

    initViewToggle();
    initLangToggle();

    // ?next= = 로그인이 필요해서 넘어오기 전에 보던 페이지 (없으면 메인)
    const params = new URLSearchParams(window.location.search);
    const next = params.get('next');

    if (params.has('signout')) {
      await supabase.auth.signOut();
      window.history.replaceState({}, '', 'login.html');
    } else {
      // 이미 로그인된 상태(예: 가입 인증 메일 링크로 들어옴)면 로그인 화면을 건너뛴다
      const { data: { session } } = await supabase.auth.getSession();
      if (session) await afterSignIn(next);
    }

    function setMsg(el, text, kind) {
      el.textContent = text;
      el.className = 'form-msg' + (kind ? ' is-' + kind : '');
      el.hidden = !text;
    }

    function setBusy(button, busy) {
      button.disabled = busy;
      button.style.opacity = busy ? '0.6' : '';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('login-msg');
      const button = document.getElementById('login-submit');
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      setMsg(msg, '', null);
      setBusy(button, true);
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      setBusy(button, false);

      if (error) {
        await logEvent('login_failed', { email });
        setMsg(msg, error.message, 'error');
        return;
      }
      await logEvent('login', { access_token: data.session.access_token });
      await afterSignIn(next);
    });

    document.getElementById('forgot-toggle').addEventListener('click', () => {
      const box = document.getElementById('forgot-box');
      box.hidden = !box.hidden;
      if (!box.hidden) document.getElementById('forgot-email').value = document.getElementById('login-email').value;
    });

    document.getElementById('forgot-send').addEventListener('click', async () => {
      const msg = document.getElementById('forgot-msg');
      const button = document.getElementById('forgot-send');
      const email = document.getElementById('forgot-email').value.trim();

      if (!email) { setMsg(msg, 'Enter your email first.', 'error'); return; }

      setBusy(button, true);
      const { error } = await requestPasswordReset(email);
      setBusy(button, false);

      setMsg(msg, error ? error.message : 'Reset link sent — check your inbox.', error ? 'error' : 'success');
    });

  </script>

  <script type="module" src="assets/legal-footer.js"></script>
</body>
</html>
