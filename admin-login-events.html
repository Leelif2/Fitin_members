<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fitin — Login Activity</title>
<script>try{var t=localStorage.getItem('fitin-theme');if(t)document.documentElement.dataset.theme=t;var m=localStorage.getItem('fitin-view-mode');if(m)document.documentElement.dataset.viewMode=m;}catch(e){}</script>
<link rel="stylesheet" href="_ds/nocturne-80ca4b25-89f2-4e0d-accf-6f8bf2e523f1/styles.css">
<link rel="stylesheet" href="assets/view-toggle.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
  body { margin: 0; }
  a { color: var(--color-accent); }
  a:hover { color: var(--color-accent-300); }

  .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin-bottom: 20px; }
  .filters .field { margin: 0; }
  .filters .input { min-height: 34px; font-size: 13px; }
  table.table td, table.table th { white-space: nowrap; }
  .ua-cell { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #denied, #loading { font-size: 14px; color: var(--color-neutral-500); }
</style>
</head>
<body style="background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);min-height:100vh">

  <header style="position:sticky;top:0;z-index:20;backdrop-filter:blur(12px);background:color-mix(in srgb, var(--color-bg) 88%, transparent);border-bottom:1px solid var(--color-divider)">
    <div style="max-width:1100px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px">
      <a href="Fitin%20Main.dc.html" style="display:flex;align-items:center;text-decoration:none">
        <img src="assets/logo.png" alt="Fitin Connection" style="height:40px;width:40px;border-radius:50%;box-shadow:0 0 0 1px color-mix(in srgb, var(--color-accent) 60%, transparent)">
      </a>
      <span class="tag tag-accent" data-i18n-ko="관리자">Admin</span>
      <div style="margin-left:auto;display:flex;align-items:center;gap:12px">
        <div id="lang-toggle-mount"></div>
        <div id="view-toggle-mount"></div>
        <button id="signout-btn" class="btn btn-secondary"><i class="ph ph-sign-out"></i><span data-i18n-ko="로그아웃">Log out</span></button>
      </div>
    </div>
  </header>

  <main style="max-width:1100px;margin:0 auto;padding:40px 24px 80px">
    <h1 style="font-size:26px;margin-bottom:4px" data-i18n-ko="로그인 활동">Login Activity</h1>
    <p style="font-size:14px;color:var(--color-neutral-500);margin:0 0 28px" data-i18n-ko="회원 로그인·로그아웃·가입·로그인 실패 기록.">Member login, logout, signup, and failed-login records.</p>

    <p id="loading" data-i18n-ko="불러오는 중…">Loading…</p>
    <p id="denied" hidden data-i18n-ko="관리자 계정만 볼 수 있는 페이지입니다.">This page is for admin accounts only.</p>

    <div id="content" hidden>
      <h2 style="font-size:16px;margin:0 0 12px" data-i18n-ko="회원별 마지막 로그인">Last login by member</h2>
      <div style="overflow-x:auto;margin-bottom:32px">
        <table class="table">
          <thead><tr><th data-i18n-ko="이름">Name</th><th data-i18n-ko="대학">University</th><th data-i18n-ko="마지막 로그인">Last login</th></tr></thead>
          <tbody id="last-login-body"></tbody>
        </table>
      </div>

      <h2 style="font-size:16px;margin:0 0 12px" data-i18n-ko="전체 기록">All events</h2>
      <div class="filters">
        <div class="field">
          <label for="f-search" data-i18n-ko="이름 / 실패 이메일 검색">Search name / failed-login email</label>
          <input class="input" id="f-search" type="text" placeholder="Search" data-i18n-ko-placeholder="검색">
        </div>
        <div class="field">
          <label for="f-type" data-i18n-ko="이벤트 유형">Event type</label>
          <select class="input" id="f-type">
            <option value="" data-i18n-ko="전체">All</option>
            <option value="login">login</option>
            <option value="logout">logout</option>
            <option value="login_failed">login_failed</option>
            <option value="signup">signup</option>
          </select>
        </div>
        <div class="field">
          <label for="f-from" data-i18n-ko="시작일">From</label>
          <input class="input" id="f-from" type="date">
        </div>
        <div class="field">
          <label for="f-to" data-i18n-ko="종료일">To</label>
          <input class="input" id="f-to" type="date">
        </div>
      </div>

      <div style="overflow-x:auto">
        <table class="table">
          <thead><tr><th data-i18n-ko="시간 (KST)">Time (KST)</th><th data-i18n-ko="이벤트">Event</th><th data-i18n-ko="회원">Member</th><th data-i18n-ko="기기">Device</th><th>IP</th><th>User-Agent</th></tr></thead>
          <tbody id="events-body"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="assets/vendor/supabase-js.js"></script>
  <script type="module">
    import { supabase, requireSession, signOut } from './assets/supabase-client.js';
    import { initViewToggle } from './assets/view-toggle.js';
    import { initLangToggle } from './assets/i18n.js';

    initViewToggle();
    initLangToggle();

    const session = await requireSession();
    if (session) {
      document.getElementById('signout-btn').addEventListener('click', signOut);

      const { data: myProfile } = await supabase
        .from('profiles')
        .select('role')
        .eq('id', session.user.id)
        .maybeSingle();

      document.getElementById('loading').hidden = true;

      if (!myProfile || myProfile.role !== 'admin') {
        document.getElementById('denied').hidden = false;
      } else {
        document.getElementById('content').hidden = false;
        await loadAndRender();
      }
    }

    async function loadAndRender() {
      const [{ data: events, error: eventsError }, { data: profiles, error: profilesError }] = await Promise.all([
        supabase.from('login_events').select('*').order('created_at', { ascending: false }).limit(500),
        supabase.from('profiles').select('id, first_name, last_name, university'),
      ]);

      if (eventsError || profilesError) {
        document.getElementById('content').innerHTML =
          '<p style="color:#f0868b">Failed to load: ' + (eventsError || profilesError).message + '</p>';
        return;
      }

      const nameById = new Map(profiles.map((p) => [p.id, [p.first_name, p.last_name].filter(Boolean).join(' ')]));
      const universityById = new Map(profiles.map((p) => [p.id, p.university || '']));

      renderLastLogins(events, profiles, nameById, universityById);
      renderEventsTable(events, nameById);

      const search = document.getElementById('f-search');
      const type = document.getElementById('f-type');
      const from = document.getElementById('f-from');
      const to = document.getElementById('f-to');
      [search, type, from, to].forEach((el) => el.addEventListener('input', () => renderEventsTable(events, nameById)));
    }

    function formatTimestamp(value) {
      return new Intl.DateTimeFormat(document.documentElement.lang === 'ko' ? 'ko-KR' : 'en-US', {
        timeZone: 'Asia/Seoul',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hourCycle: 'h23',
      }).format(new Date(value)) + ' KST';
    }

    function renderLastLogins(events, profiles, nameById, universityById) {
      const lastLoginByUser = new Map();
      for (const ev of events) {
        if (ev.event_type !== 'login' || !ev.user_id) continue;
        const current = lastLoginByUser.get(ev.user_id);
        if (!current || ev.created_at > current) lastLoginByUser.set(ev.user_id, ev.created_at);
      }

      const rows = profiles
        .map((p) => ({
          name: [p.first_name, p.last_name].filter(Boolean).join(' ') || '(no name)',
          university: p.university || '—',
          lastLogin: lastLoginByUser.get(p.id) || null,
        }))
        .sort((a, b) => (b.lastLogin || '').localeCompare(a.lastLogin || ''));

      const body = document.getElementById('last-login-body');
      body.innerHTML = rows
        .map(
          (r) =>
            '<tr><td>' + escapeHtml(r.name) + '</td><td>' + escapeHtml(r.university) + '</td><td>' +
            (r.lastLogin ? formatTimestamp(r.lastLogin) : '—') + '</td></tr>'
        )
        .join('');
    }

    function renderEventsTable(events, nameById) {
      const search = document.getElementById('f-search').value.trim().toLowerCase();
      const type = document.getElementById('f-type').value;
      const from = document.getElementById('f-from').value;
      const to = document.getElementById('f-to').value;

      const filtered = events.filter((ev) => {
        const who = ev.user_id ? nameById.get(ev.user_id) || '' : ev.attempted_email || '';
        if (search && !who.toLowerCase().includes(search)) return false;
        if (type && ev.event_type !== type) return false;
        if (from && ev.created_at < from) return false;
        if (to && ev.created_at > to + 'T23:59:59') return false;
        return true;
      });

      const body = document.getElementById('events-body');
      body.innerHTML = filtered
        .map((ev) => {
          const who = ev.user_id ? nameById.get(ev.user_id) || '(deleted user)' : ev.attempted_email || '—';
          return (
            '<tr><td>' + formatTimestamp(ev.created_at) + '</td><td>' + escapeHtml(ev.event_type) + '</td><td>' +
            escapeHtml(who) + '</td><td>' + escapeHtml(ev.device || '—') + '</td><td>' + escapeHtml(ev.ip_address || '—') +
            '</td><td class="ua-cell" title="' + escapeHtml(ev.user_agent || '') + '">' + escapeHtml(ev.user_agent || '—') + '</td></tr>'
          );
        })
        .join('');
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
  </script>

  <script type="module" src="assets/legal-footer.js"></script>
</body>
</html>
